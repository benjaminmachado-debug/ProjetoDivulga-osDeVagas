<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Cadastre-se</h2>

        <form>

            <label>Nome Completo:</label>
        <br>    
            <input type="text" class="placeholder"placeholder="Digite seu nome">
        
            <label>E-mail:</label>
        <br>    
            <input type="email" class="placeholder" placeholder="Digite seu e-mail">
            
          

            <label>Senha:</label>
        <br>    
            <input type="password" class="placeholder" placeholder="Crie uma senha">

            <button type="submit">Concluir</button>

        </form>

    </div>

</body>
</html>
